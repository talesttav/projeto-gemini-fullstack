<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Gerenciador de Tarefas</title>
</head>
<body>
    <h1>Gerenciador de Tarefas</h1>
    <form action="/adicionar" method="post">
        <label for="titulo">Título da Tarefa:</label>
        <input type="text" id="titulo" name="titulo" required>
        <button type="submit">Adicionar Tarefa</button>
    <hr>

    <h2>Suas Tarefas:</h2>
    <ul>
        {% for tarefa in tarefas %}
            <li>
                <strong>ID: 0{{ tarefa.id }}</strong> - {{ tarefa.titulo }}
                
                {% if tarefa.concluida %}
                    <span style="color: green;">(Concluída)</span>
                {% else %}
                    <span style="color: orange;">(Pendente)</span>
                    <a href="/concluir/{{ tarefa.id }}">[Concluir]</a>
                {% endif %}

                <a href="/excluir/{{ tarefa.id }}" style="color: red; margin-left: 10px;">[Excluir]</a>

            </li>
        {% endfor %}
    </ul>
</body>
</html>
