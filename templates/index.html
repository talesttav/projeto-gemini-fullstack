<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Gerenciador de Tarefas</title>
</head>
<body>
    <h1>Gerenciador de Tarefas</h1>
    <hr>

    <h2>Suas Tarefas:</h2>
    <ul>
        {% for tarefa in tarefas %}
            <li>
                <strong>ID: 0{{ tarefa.id }}</strong> - {{ tarefa.titulo }}
                {% if tarefa.concluida %}
                    <span>(Concluída)</span>
                {% else %}
                    <span>(Pendente)</span>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
